name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish/update the rolling 'nightly' pre-release with the APKs"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compile
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Name artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/retrobit-desktop-${{ github.run_number }}-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/retrobit-desktop-${{ github.run_number }}-debug.apk
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-desktop-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish APKs
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Retrobit Desktop ${TAG}"
            NOTES="Signed release build of Retrobit Desktop ${TAG}. Install the release APK on the tablet (allow install from unknown sources)."
            PRERELEASE=""
          else
            TAG="nightly"
            TITLE="Retrobit Desktop — nightly (build #${GITHUB_RUN_NUMBER})"
            NOTES="Rolling pre-release built from \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA::7}). Always the newest installable APK."
            PRERELEASE="--prerelease"
          fi
          if gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "${GITHUB_REPOSITORY}" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" -R "${GITHUB_REPOSITORY}" --title "$TITLE" --notes "$NOTES" $PRERELEASE
          fi
          gh release upload "$TAG" dist/*.apk -R "${GITHUB_REPOSITORY}" --clobber
